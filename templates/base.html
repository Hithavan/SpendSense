<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SpendSense{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('expenses.index') }}">
        <span class="brand-badge"><i class="bi bi-wallet2"></i></span> SpendSense
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          {% if current_user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('expenses.dashboard_page') }}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('expenses.expenses_page') }}"><i class="bi bi-list-ul me-1"></i>All Expenses</a></li>
          <li class="nav-item">
            <a class="nav-link add-expense-link" href="{{ url_for('expenses.add_expense_page') }}"><i class="bi bi-plus-circle me-1"></i>Add Expense</a>
          </li>
          <li class="nav-item d-flex align-items-center ms-lg-2">
            <form method="post" action="{{ url_for('logout') }}">
              <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
            </form>
          </li>
          {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Sign in</a></li>
          <li class="nav-item ms-lg-2"><a class="btn btn-sm btn-light" href="{{ url_for('register') }}">Create account</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 fade-in">
    {% block content %}{% endblock %}
  </main>

  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
