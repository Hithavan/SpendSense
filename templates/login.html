{% extends "base.html" %}
{% block title %}Login - SpendSense{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4">Sign in</h1>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
          <label class="form-label" for="username">Username</label>
          <input class="form-control mb-3" id="username" name="username" required autofocus>
          <label class="form-label" for="password">Password</label>
          <input class="form-control mb-4" id="password" name="password" type="password" required>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0">
          New here? <a href="{{ url_for('register') }}">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
