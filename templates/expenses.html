{% extends "base.html" %}
{% block title %}All Expenses{% endblock %}
{% block content %}
<h2 class="mb-4">All Expenses</h2>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Category</label>
        <select id="filterCategory" class="form-select">
          <option value="All">All</option>
          {% for c in categories %}
          <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Month</label>
        <select id="filterMonth" class="form-select">
          <option value="">All</option>
          <option value="1">January</option><option value="2">February</option>
          <option value="3">March</option><option value="4">April</option>
          <option value="5">May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option>
          <option value="9">September</option><option value="10">October</option>
          <option value="11">November</option><option value="12">December</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Search Merchant</label>
        <input type="text" id="filterSearch" class="form-control" placeholder="e.g. Cafe">
      </div>
      <div class="col-md-2">
        <label class="form-label">Sort</label>
        <select id="filterSort" class="form-select">
          <option value="date_desc">Newest first</option>
          <option value="date_asc">Oldest first</option>
          <option value="amount_desc">Amount: high to low</option>
          <option value="amount_asc">Amount: low to high</option>
        </select>
      </div>
      <div class="col-md-2">
        <button id="applyFilters" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i>Apply</button>
      </div>
    </div>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-hover align-middle bg-white shadow-sm">
    <thead>
      <tr>
        <th>Date</th>
        <th>Merchant</th>
        <th>Category</th>
        <th class="text-end">Amount</th>
        <th class="text-end">Action</th>
      </tr>
    </thead>
    <tbody id="expenseTableBody">
      <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
    </tbody>
  </table>
</div>

<!-- Edit modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" name="id" id="editId">
          <div class="mb-3">
            <label class="form-label">Merchant</label>
            <input type="text" class="form-control" name="merchant" id="editMerchant">
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (₹)</label>
            <input type="number" step="0.01" class="form-control" name="amount" id="editAmount" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" id="editDate">
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category" id="editCategory">
              {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" id="editDescription" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/expenses.js') }}"></script>
{% endblock %}
